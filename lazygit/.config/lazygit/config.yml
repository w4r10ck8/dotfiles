gui:
  theme:
    activeBorderColor:
      - '#0b4f79'
      - bold
    inactiveBorderColor:
      - '#4a4a4a'
    optionsTextColor:
      - '#795ccc'
    selectedLineBgColor:
      - '#cfe2ff'
    selectedRangeBgColor:
      - '#cfe2ff'
    cherryPickedCommitBgColor:
      - '#0b4f79'
    cherryPickedCommitFgColor:
      - '#ffffff'
    unstagedChangesColor:
      - '#c41a16'
    defaultFgColor:
      - '#262626'

customCommands:
  - key: "C"
    context: "global"
    command: "code ."
    description: "Open VS Code"
    output: terminal
  - key: "C"
    context: "localBranches"
    prompts:
      - type: "input"
        title: "What are you working on? (paste ticket)"
        key: "Ticket"
      - type: "menuFromCommand"
        title: "Choose a branch name"
        key: "Branch"
        command: "/Users/w4r10ck/dotfiles/lazygit/scripts/ai-branch-suggestions.sh '{{.Form.Ticket}}'"
        filter: "^(?P<branch>.+)$"
        valueFormat: "{{ .branch }}"
        labelFormat: "{{ .branch }}"
    command: "/Users/w4r10ck/dotfiles/lazygit/scripts/ai-branch.sh '{{.Form.Branch}}'"
    loadingText: "Preparing branch options..."
    output: none
    description: "Create branch from ticket"
  - key: "<c-g>"
    context: "commitMessage"
    description: "AI: generate commit message from staged files"
    command: '~/dotfiles/lazygit/scripts/ai-commit.sh | pbcopy'
    loadingText: "Generating commit message with AI..."
